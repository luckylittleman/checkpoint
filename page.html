<!doctype html><meta charset=utf-8><title>Checkpoint</title>
<style>
body{margin:0;font:15px system-ui;background:#111;color:#ddd;display:flex;flex-direction:column;height:100vh}
header{display:flex;justify-content:space-between;padding:10px 16px;background:#1b1b1b;border-bottom:1px solid #333}
#timer{font:bold 18px monospace}main{display:flex;flex:1;min-height:0}
#left{width:42%;overflow:auto;padding:16px;border-right:1px solid #333;box-sizing:border-box}
#right{flex:1;display:flex;flex-direction:column;min-width:0}
.box{display:flex;justify-content:space-between;gap:12px;border:1px solid #444;border-radius:6px;padding:8px 12px;margin:8px 0}
h2{margin:0}h3{margin:16px 0 4px}
pre{white-space:pre-wrap;background:#1b1b1b;padding:10px;border-radius:6px;margin:6px 0}
#tabs{display:flex;gap:4px;padding:8px 8px 0;background:#161616}
.tab{padding:6px 12px;border:1px solid #444;border-bottom:0;border-radius:6px 6px 0 0;cursor:pointer}
.tab.on{background:#0b0b0b}.tab::after{content:" ×";color:#777}
textarea{flex:1;background:#0b0b0b;color:#eee;border:0;border-top:1px solid #444;font:14px monospace;tab-size:4;padding:10px;resize:none;outline:0}
#bar input{background:#0b0b0b;color:#eee;border:1px solid #444;border-radius:4px;padding:6px}#bar button{margin-left:6px}#bar{padding:6px 8px;background:#161616;border-top:1px solid #444}
#out{height:25%;overflow:auto;margin:0;border-radius:0;border-top:1px solid #444;background:#000;color:#cfc;font:13px monospace;padding:10px}
button{background:#2d6cdf;color:#fff;border:0;padding:8px 16px;border-radius:6px;cursor:pointer}
input[type=number]{width:60px}.ok{color:#5ecb71}.bad{color:#ff6b6b}
</style>
<header><b id=title>Checkpoint simulator</b><span id=timer></span></header>
<main id=setup style="padding:24px;display:block">
Minutes <input id=min type=number value=60> Questions <input id=cnt type=number value=10>
<label><input id=det type=checkbox> show failing test details</label>
<button onclick=start()>Start</button></main>
<main id=exam style=display:none>
<section id=left>
 <h2 id=qt></h2>
 <div class=box><b>Requirement</b><span>Allowed functions<br><b id=allowed></b></span></div>
 <h3>Instructions</h3><pre id=qs></pre>
 <h3 id=eh>Expected function</h3><pre id=ef></pre>
 <h3 id=uh>Usage</h3><pre id=us></pre>
</section>
<section id=right>
 <div id=tabs></div>
 <textarea id=code spellcheck=false></textarea>
 <div id=bar>$ go run . <input id=args placeholder="arguments" size=28> <button onclick=runCode()>Run</button> <button onclick=submitCode()>Submit</button></div>
 <pre id=out></pre>
</section></main>
<script>
let qid=null,tick=null,files={},active='sol';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function api(p,b){const r=await fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});return r.json()}
async function start(){qid=null;render(await api('start',{minutes:+$('min').value,count:+$('cnt').value,details:$('det').checked}))}
function fmt(s){return [s/3600|0,(s%3600)/60|0,s%60].map(x=>String(x).padStart(2,'0')).join(':')}
function setTab(t){files[active]=$('code').value;active=t;$('code').value=files[t];document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.t===t))}
$('tabs').onclick=e=>{if(e.target.dataset.t)setTab(e.target.dataset.t)};
function render(s){
 clearInterval(tick);if(!s.started)return;
 $('setup').style.display='none';$('exam').style.display='flex';
 let left=s.remaining;$('timer').textContent=fmt(left);
 if(!s.finished)tick=setInterval(()=>{left=Math.max(0,left-1);$('timer').textContent=fmt(left);if(!left)api('state').then(render)},1000);
 if(s.finished){$('title').textContent='Checkpoint';$('exam').innerHTML=`<section style="padding:24px"><h2>${s.timed_out?'Time is up':'Checkpoint complete'}</h2><p>Passed ${s.passed} / ${s.total}</p><button onclick=location.reload()>New session</button></section>`;return}
 const q=s.question;
 $('title').textContent=`LEVEL ${q.rank}/${q.ranks}`;
 $('qt').textContent=q.title;$('allowed').textContent=q.allowed;$('qs').textContent=q.statement;
 $('eh').style.display=$('ef').style.display=q.expected?'':'none';$('ef').textContent=q.expected||'';
 const u=(q.main_code||'')+(q.run?'\n'+q.run:'');
 $('uh').style.display=$('us').style.display=u?'':'none';$('us').textContent=u;
 if(qid!==q.id){
  qid=q.id;files={sol:q.starter};active='sol';
  if(q.scratch)files.main=q.scratch;
  $('tabs').innerHTML=(q.scratch?'<span class=tab data-t=main>main.go</span>':'')+`<span class="tab on" data-t=sol>${esc(q.file)}</span>`;
  $('code').value=q.starter;$('out').textContent='';
 }
}
async function runCode(){
 files[active]=$('code').value;const h='$ go run . '+$('args').value+'\n';$('out').textContent=h+'Running...';
 const r=await api('run',{sol:files.sol,main:files.main||'',args:$('args').value});
 $('out').textContent=h+(r.detail||r.output||'(no output)');
}
async function submitCode(){
 files[active]=$('code').value;$('out').textContent='Running...';
 const r=await api('submit',{code:files.sol});
 if(r.detail){$('out').textContent=r.detail;return}
 const x=r.result;let t;
 if(x.ok)t=`<span class=ok>PASSED (${x.total}/${x.total} tests)</span>`;
 else if(x.stage==='test'){const d=x.detail;t=`<span class=bad>FAILED test ${x.test}/${x.total}</span>`+(d?`\nargs: ${esc(JSON.stringify(d.args))}\nexpected: ${esc(JSON.stringify(d.expected))}\ngot: ${esc(JSON.stringify(d.got))}\n${esc(d.error)}`:'')}
 else t=`<span class=bad>${esc(x.stage.toUpperCase())} ERROR</span>\n${esc(x.msg)}`;
 $('out').innerHTML='<b>$ submit</b>\n'+t;
 setTimeout(()=>render(r.state),x.ok?900:0);
}
$('code').addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const t=e.target;t.setRangeText('\t',t.selectionStart,t.selectionEnd,'end')}});
api('state').then(s=>s.started&&!s.finished&&render(s));
</script>
